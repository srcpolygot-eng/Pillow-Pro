[build-system]
build-backend = "backend"
requires = [
  "pybind11",
  "setuptools>=77",
]
backend-path = [
  "_custom_build",
]

[project]
name = "pillow-pro"
description = "A powerful, extensible image processing and editing engine built directly on Pillow."
readme = "README.md"
keywords = [
  "image",
  "imaging",
  "image-processing",
  "image-editing",
  "graphics",
  "raster",
  "compositing",
  "layers",
  "masks",
  "brushes",
  "filters",
  "effects",
  "color",
  "transformations",
  "photography",
  "pillow",
]
license = "MIT-CMU"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Jeffrey 'Alex' Clark", email = "aclark@aclark.net" },
]

requires-python = ">=3.11"

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Multimedia :: Graphics :: Viewers",
  "Typing :: Typed",
]

dynamic = [
  "version",
]

[project.optional-dependencies]

docs = [
  "furo",
  "olefile",
  "sphinx>=8.2",
  "sphinx-autobuild",
  "sphinx-copybutton",
  "sphinx-inline-tabs",
  "sphinxext-opengraph",
]

fpx = [
  "olefile",
]

mic = [
  "olefile",
]

xmp = [
  "defusedxml",
]

test-arrow = [
  "arro3-compute",
  "arro3-core",
  "nanoarrow",
  "pyarrow",
]

tests = [
  "coverage>=7.4.2",
  "defusedxml",
  "markdown2",
  "olefile",
  "packaging",
  "psutil; sys_platform=='linux' or sys_platform=='darwin'",
  "pytest",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "setuptools",
  "trove-classifiers>=2024.10.12",
]

dev = [
  "black",
  "mypy",
  "pyproject-fmt",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/srcpolygot-eng/Pillow-Pro"
Documentation = "https://github.com/srcpolygot-eng/Pillow-Pro"
Source = "https://github.com/srcpolygot-eng/Pillow-Pro"
Issues = "https://github.com/srcpolygot-eng/Pillow-Pro/issues"
Changelog = "https://github.com/srcpolygot-eng/Pillow-Pro/releases"
Upstream = "https://github.com/python-pillow/Pillow"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
packages = [
  "PIL",
  "PIL.*",
]
dynamic.version = { attr = "PIL.__version__" }

[tool.cibuildwheel]
build-verbosity = 1

config-settings = "raqm=enable raqm=vendor fribidi=vendor imagequant=disable"

before-all = ".github/workflows/wheels-dependencies.sh"

test-command = "cd {project} && .github/workflows/wheels-test.sh"

test-requires = [
  "numpy",
]

test-extras = [
  "tests",
]

macos.config-settings = "raqm=enable raqm=vendor fribidi=vendor imagequant=disable platform-guessing=disable"

macos.environment.PATH = """\
$(pwd)/build/deps/darwin/bin:$(dirname $(which python3)):/usr/bin:/bin:/usr/sbin:/sbin:/Library/Apple/usr/bin\
"""

ios.config-settings = "raqm=disable imagequant=disable platform-guessing=disable"

ios.test-command = [
  "python -m selftest",
  "python -m pytest -vv -x -W always checks/check_wheel.py Tests",
]

ios.test-requires = []

ios.test-sources = [
  "checks",
  "Tests",
  "selftest.py",
]

overrides = [
  { select = "*_iphoneos", environment.PATH = "$(pwd)/build/deps/iphoneos/bin:$PATH" },
  { select = "*_iphonesimulator", environment.PATH = "$(pwd)/build/deps/iphonesimulator/bin:$PATH" },
  { select = "*-win32", test-requires = [] },
  { select = "cp315*-win_amd64", test-requires = [] },
]

xbuild-tools = []

[tool.black]
exclude = "wheels/multibuild"

[tool.ruff]
exclude = [
  "wheels/multibuild",
]

fix = true

lint.select = [
  "C4",
  "E",
  "EM",
  "F",
  "I",
  "ISC",
  "LOG",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "PYI",
  "RUF100",
  "TC",
  "UP",
  "W",
  "YTT",
]

lint.ignore = [
  "E203",
  "E221",
  "E226",
  "E241",
  "PIE790",
  "PT001",
  "PT007",
  "PT011",
  "PT012",
  "PT017",
]

lint.per-file-ignores."Tests/oss-fuzz/fuzz_font.py" = [
  "I002",
]

lint.per-file-ignores."Tests/oss-fuzz/fuzz_pillow.py" = [
  "I002",
]

lint.flake8-pytest-style.parametrize-names-type = "csv"

lint.isort.known-first-party = [
  "PIL",
]

lint.isort.required-imports = [
  "from __future__ import annotations",
]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.mypy]
exclude = [
  "^Tests/images/msp/",
  "^Tests/images/picins/",
  "^Tests/images/sunraster/",
]

follow_imports = "silent"
python_version = "3.11"

disallow_any_generics = true
disallow_untyped_defs = true

warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

enable_error_code = "ignore-without-code"

extra_checks = true
pretty = true
num_workers = 4

[tool.pytest]
addopts = [
  "-ra",
  "--color=auto",
]

testpaths = [
  "Tests",
]

[tool.coverage]
run.omit = [
  "checks/*.py",
  "Tests/benchmarks.py",
  "Tests/createfontdatachunk.py",
]

run.disable_warnings = [
  "no-sysmon",
]

run.core = "sysmon"

report.exclude_also = [
  "@abc.abstractmethod",
  "^\\s*def [a-zA-Z0-9_]+\\(.*\\)(\\s*->.*)?:\\s*\\.\\.\\.(\\s*#.*)?$",
  "except ImportError",
  "if __name__ == .__main__.:",
  "if DEBUG:",
]
